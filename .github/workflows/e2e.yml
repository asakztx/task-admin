name: CI — e2e-тесты (Playwright)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Установить браузер Chromium
        run: npx playwright install --with-deps chromium

      - name: Запустить веб-сервер (http.server на 8080)
        run: |
          nohup python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/httpd.log 2>&1 &
          sleep 1
          curl -fsS http://127.0.0.1:8080/index.html > /dev/null && echo "сервер запущен"

      - name: Запустить e2e-тесты
        run: npm test
