<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление задачами — pcdev-0005</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container py-4" style="max-width: 640px;">
    <h1 class="text-center mb-4">Управление задачами — pcdev-0005</h1>

    <section class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5">Пользователь</h2>
        <form id="user-form" class="d-flex gap-2 flex-wrap">
          <label class="visually-hidden" for="user-name">Имя пользователя</label>
          <input type="text" id="user-name" class="form-control flex-grow-1" placeholder="Введите ваше имя" required>
          <button type="submit" class="btn btn-primary">Сменить пользователя</button>
        </form>
        <p class="mb-0 mt-3 text-muted">Текущий пользователь: <strong id="current-user-label"></strong></p>
      </div>
    </section>

    <section class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5">Новая задача</h2>
        <form id="task-form">
          <input type="hidden" id="task-id">
          <div class="mb-3">
            <label class="form-label" for="task-title">Название</label>
            <input type="text" id="task-title" class="form-control" placeholder="Введите название задачи" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="task-priority">Приоритет</label>
            <select id="task-priority" class="form-select">
              <option value="высокий">высокий</option>
              <option value="средний">средний</option>
              <option value="низкий">низкий</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label" for="task-start">Дата начала</label>
            <input type="date" id="task-start" class="form-control">
          </div>
          <div class="d-flex gap-2">
            <button type="submit" id="task-submit" class="btn btn-primary">Сохранить</button>
            <button type="button" id="task-cancel" class="btn btn-outline-secondary" hidden>Отмена</button>
          </div>
        </form>
        <p id="confirmation" class="alert alert-success mt-3 mb-0" hidden></p>
      </div>
    </section>

    <section class="card shadow-sm">
      <div class="card-body">
        <h2 class="h5">Список задач</h2>
        <ul id="task-list" class="list-unstyled mb-0"></ul>
        <p id="empty-message" class="text-muted fst-italic mb-0" hidden>Список задач пуст</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
