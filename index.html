<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление задачами — pcdev-0005</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container py-4" style="max-width: 640px;">
    <h1 class="text-center mb-4">Управление задачами — pcdev-0005</h1>

    <section class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5">Пользователь</h2>
        <form id="user-form" class="d-flex gap-2 flex-wrap">
          <label class="visually-hidden" for="user-name">Имя пользователя</label>
          <input type="text" id="user-name" class="form-control flex-grow-1" placeholder="Введите ваше имя" required>
          <button type="submit" class="btn btn-primary">Сменить пользователя</button>
        </form>
        <p class="mb-0 mt-3 text-muted">Текущий пользователь: <strong id="current-user-label"></strong></p>
      </div>
    </section>

    <section class="card shadow-sm mb-4">
      <div class="card-body d-flex flex-wrap gap-2 align-items-center justify-content-between">
        <span class="text-muted small">Резервное копирование задач текущего пользователя</span>
        <span class="d-flex gap-2">
          <button type="button" id="task-export" class="btn btn-outline-primary btn-sm">Экспорт в JSON</button>
          <label class="btn btn-outline-secondary btn-sm mb-0">
            Импорт из JSON
            <input type="file" id="task-import" accept=".json,application/json" class="visually-hidden">
          </label>
        </span>
      </div>
    </section>

    <section class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5">Новая задача</h2>
        <form id="task-form">
          <input type="hidden" id="task-id">
          <div class="mb-3">
            <label class="form-label" for="task-title">Название</label>
            <input type="text" id="task-title" class="form-control" placeholder="Введите название задачи" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="task-priority">Приоритет</label>
            <select id="task-priority" class="form-select">
              <option value="высокий">высокий</option>
              <option value="средний">средний</option>
              <option value="низкий">низкий</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label" for="task-start">Дата начала</label>
            <input type="date" id="task-start" class="form-control">
          </div>
          <div class="d-flex gap-2">
            <button type="submit" id="task-submit" class="btn btn-primary">Сохранить</button>
            <button type="button" id="task-cancel" class="btn btn-outline-secondary" hidden>Отмена</button>
          </div>
        </form>
        <p id="confirmation" class="alert alert-success mt-3 mb-0" hidden></p>
      </div>
    </section>

    <section class="card shadow-sm">
      <div class="card-body">
        <h2 class="h5">Список задач</h2>

        <div class="d-flex gap-2 flex-wrap mb-3">
          <label class="visually-hidden" for="task-search">Поиск по названию</label>
          <input type="search" id="task-search" class="form-control flex-grow-1" placeholder="Поиск по названию…" autocomplete="off">
          <label class="visually-hidden" for="task-filter">Фильтр по статусу</label>
          <select id="task-filter" class="form-select" style="max-width: 180px;">
            <option value="all">Все</option>
            <option value="active">В работе</option>
            <option value="done">Выполненные</option>
          </select>
          <label class="visually-hidden" for="task-sort">Сортировка</label>
          <select id="task-sort" class="form-select" style="max-width: 200px;">
            <option value="created">По дате создания</option>
            <option value="priority">По приоритету</option>
            <option value="start">По дате начала</option>
          </select>
        </div>

        <p id="task-stats" class="text-muted small mb-2"></p>

        <ul id="task-list" class="list-unstyled mb-0"></ul>
        <p id="empty-message" class="text-muted fst-italic mb-0" hidden>Список задач пуст</p>
        <p id="no-match-message" class="text-muted fst-italic mb-0" hidden>Ничего не найдено по заданным условиям</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
